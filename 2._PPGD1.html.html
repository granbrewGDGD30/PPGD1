<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPGD1</title>
<style>
  *{box-sizing:border-box}
  body{font:14px/1.6 system-ui,"Noto Sans JP",sans-serif;margin:0;color:#111;background:#fafafa}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:10}
  #gdr{background:#111;color:#fff;border:0;padding:8px 20px;font-weight:700;border-radius:4px;cursor:pointer}
  button{padding:6px 12px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer}
  button:hover{background:#f0f0f0}
  input[type=text]{padding:6px 8px;border:1px solid #bbb;border-radius:4px}
  #url{flex:1;min-width:260px}
  main{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
  .panel{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px;flex:1;min-width:300px}
  h3{margin:4px 0 10px;font-size:13px;text-transform:uppercase;color:#666;letter-spacing:.05em}
  ul{list-style:none;margin:0;padding:0}
  li{padding:6px 4px;border-bottom:1px solid #f0f0f0}
  .novel{cursor:pointer}
  .novel:hover{background:#f5f5f5}
  .novel.sel{background:#eef3ff}
  .meta{color:#888;font-size:12px}
  label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
  #log{padding:0 16px 16px;color:#555;font-size:12px;white-space:pre-wrap;max-height:150px;overflow:auto}
  .row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <button id="gdr">GDR</button>
  <input type="text" id="url" placeholder="https://kakuyomu.jp/works/…  |  https://ncode.syosetu.com/n9636x/">
  <button id="fetchBtn">Fetch &amp; Save</button>
  <input type="text" id="proxy" placeholder="proxy prefix (optional)" style="width:200px">
  <input type="text" id="delay" value="1200" title="delay ms" style="width:70px">
  <button id="dirBtn">Choose folder</button>
</header>

<main>
  <section class="panel">
    <h3>Novels (newest first)</h3>
    <ul id="novels"></ul>
  </section>
  <section class="panel">
    <h3 id="epHead">Episodes</h3>
    <div class="row">
      <button id="all">All</button><button id="none">None</button><button id="inv">Invert</button>
      <button id="del" style="margin-left:auto;color:#a00">Delete novel</button>
    </div>
    <ul id="eps"></ul>
  </section>
</main>
<div id="log"></div>

<script>
/* ---------------- tiny IndexedDB layer ---------------- */
const DB=(()=>{let p;return()=>p||(p=new Promise((res,rej)=>{
  const r=indexedDB.open('PPGD1',1);
  r.onupgradeneeded=()=>{const d=r.result;
    d.createObjectStore('novels',{keyPath:'id'});
    const e=d.createObjectStore('episodes',{keyPath:'key'});
    e.createIndex('novelId','novelId');
    d.createObjectStore('kv');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}))})();
async function tx(store,mode,fn){const db=await DB();return new Promise((res,rej)=>{
  const t=db.transaction(store,mode),s=t.objectStore(store);let out;
  out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);});}
const put=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const getAll=(s)=>tx(s,'readonly',st=>st.getAll());
const byNovel=(id)=>tx('episodes','readonly',st=>st.index('novelId').getAll(id));
const kvSet=(k,v)=>tx('kv','readwrite',st=>st.put(v,k));
const kvGet=(k)=>tx('kv','readonly',st=>st.get(k));

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const log=m=>{$('#log').textContent+=m+'\n';$('#log').scrollTop=1e9;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const safe=s=>(s||'untitled').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim().slice(0,80);
const pad=(n,w=4)=>String(n).padStart(w,'0');

async function getHTML(u){
  const px=$('#proxy').value.trim();
  const target=px?px+encodeURIComponent(u):u;
  const r=await fetch(target,{credentials:'omit'});
  if(!r.ok) throw new Error(r.status+' '+u);
  return new DOMParser().parseFromString(await r.text(),'text/html');
}
/* body node -> plain text, ruby stripped, one line per <p> */
function toText(node){
  if(!node) return '';
  const c=node.cloneNode(true);
  c.querySelectorAll('rt,rp').forEach(n=>n.remove());
  c.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  const ps=c.querySelectorAll('p');
  const raw=ps.length?[...ps].map(p=>p.textContent.replace(/\u00a0/g,' ').trimEnd()).join('\n')
                     :c.textContent;
  return raw.replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------------- site adapters ---------------- */
function detect(u){
  const url=new URL(u);
  if(/kakuyomu\.jp$/.test(url.hostname)){
    const m=url.pathname.match(/\/works\/(\d+)/); if(!m) throw new Error('bad kakuyomu url');
    return {site:'kakuyomu',id:'kakuyomu:'+m[1],workId:m[1],
            tocUrl:'https://kakuyomu.jp/works/'+m[1]};
  }
  if(/(^|\.)syosetu\.com$/.test(url.hostname)){
    const m=url.pathname.match(/^\/([a-z0-9]+)/i); if(!m) throw new Error('bad syosetu url');
    return {site:'syosetu',id:'syosetu:'+m[1],ncode:m[1].toLowerCase(),
            base:url.origin+'/'+m[1].toLowerCase()+'/'};
  }
  throw new Error('unsupported site');
}

async function tocKakuyomu(t){
  const doc=await getHTML(t.tocUrl);
  const title=(doc.querySelector('#workTitle a')||doc.querySelector('h1')||{}).textContent?.trim()||t.workId;
  const author=doc.querySelector('#workAuthor-activityName')?.textContent.trim()||'';
  let eps=[];
  const s=doc.querySelector('#__NEXT_DATA__');
  if(s){ try{
    const st=JSON.parse(s.textContent).props.pageProps.__APOLLO_STATE__;
    for(const k in st) if(/^Episode:/.test(k)&&st[k].title)
      eps.push({eid:k.slice(8),title:st[k].title,at:st[k].publishedAt||''});
  }catch(e){} }
  if(!eps.length){ // DOM fallback
    const seen=new Set();
    doc.querySelectorAll('a[href*="/episodes/"]').forEach(a=>{
      const m=a.getAttribute('href').match(/\/episodes\/(\d+)/); if(!m||seen.has(m[1]))return;
      seen.add(m[1]); eps.push({eid:m[1],title:a.textContent.trim()});});
  }
  return {title,author,episodes:eps.map(e=>({...e,url:'https://kakuyomu.jp/works/'+t.workId+'/episodes/'+e.eid}))};
}

async function tocSyosetu(t){
  let title='',author='',eps=[],p=1;
  while(p<=200){
    const doc=await getHTML(t.base+(p>1?'?p='+p:''));
    if(p===1){
      title=(doc.querySelector('.p-novel__title')||doc.querySelector('.novel_title')||{}).textContent?.trim()||t.ncode;
      author=doc.querySelector('.p-novel__author')?.textContent.trim().replace(/^作者：/,'')||'';
    }
    const links=doc.querySelectorAll('a.p-eplist__subtitle, .novel_sublist2 dd.subtitle a');
    if(!links.length) break;
    links.forEach(a=>{
      const h=a.getAttribute('href');const m=h.match(/\/(\d+)\/?$/); if(!m)return;
      eps.push({eid:m[1],title:a.textContent.trim(),url:new URL(h,t.base).href});});
    if(!doc.querySelector('.c-pager__item--next, .novelview_pager-next')) break;
    p++; await sleep(+$('#delay').value||1000);
  }
  if(!eps.length) eps.push({eid:'1',title:title,url:t.base}); // 短編
  return {title,author,episodes:eps};
}

async function episodeText(t,url){
  const doc=await getHTML(url);
  if(t.site==='kakuyomu'){
    return {title:doc.querySelector('.widget-episodeTitle')?.textContent.trim()||'',
            text:toText(doc.querySelector('.widget-episodeBody, .js-episode-body'))};
  }
  const st=doc.querySelector('.p-novel__title--rensai, .novel_subtitle');
  const parts=[...doc.querySelectorAll('.js-novel-text, #novel_p, #novel_honbun, #novel_a')]
              .map(toText).filter(Boolean);
  return {title:st?st.textContent.trim():'',
          text:parts.length?parts.join('\n\n――――――\n\n'):toText(doc.querySelector('.p-novel__body'))};
}

/* ---------------- folder output ---------------- */
let rootDir=null;
async function ensureDir(){
  if(rootDir&&await rootDir.queryPermission({mode:'readwrite'})==='granted') return rootDir;
  const saved=await kvGet('dir');
  if(saved&&await saved.requestPermission({mode:'readwrite'})==='granted'){rootDir=saved;return rootDir;}
  return null;
}
async function writeFile(novelFolder,name,text){
  const root=await ensureDir(); if(!root) return false;
  const d=await root.getDirectoryHandle(novelFolder,{create:true});
  const f=await d.getFileHandle(name,{create:true});
  const w=await f.createWritable(); await w.write(text); await w.close(); return true;
}

/* ---------------- main flow ---------------- */
async function run(){
  const t=detect($('#url').value.trim());
  log('▶ reading table of contents…');
  const toc=t.site==='kakuyomu'?await tocKakuyomu(t):await tocSyosetu(t);
  log(`  ${toc.title} — ${toc.episodes.length} episode(s)`);
  const folder=safe(toc.title)+' ['+t.id.replace(':','_')+']';
  await put('novels',{id:t.id,site:t.site,title:toc.title,author:toc.author,
                      sourceUrl:$('#url').value.trim(),folder,count:toc.episodes.length,addedAt:Date.now()});
  await render(); select(t.id);
  const d=+$('#delay').value||1000;
  for(let i=0;i<toc.episodes.length;i++){
    const e=toc.episodes[i];
    try{
      const r=await episodeText(t,e.url);
      const title=r.title||e.title||('Episode '+(i+1));
      const body=`${toc.title}\n${title}\n${e.url}\n\n${r.text}\n`;
      await put('episodes',{key:t.id+'::'+pad(i+1),novelId:t.id,idx:i+1,title,url:e.url,text:r.text});
      const ok=await writeFile(folder,`${pad(i+1)}_${safe(title)}.txt`,body);
      log(`  [${i+1}/${toc.episodes.length}] ${title}${ok?'':'  (db only – no folder chosen)'}`);
    }catch(err){log(`  ! ${i+1} failed: ${err.message}`);}
    if(i<toc.episodes.length-1) await sleep(d);
    if(cur===t.id) await showEps(t.id);
  }
  log('✔ done\n');
}

/* ---------------- UI ---------------- */
let cur=null;
async function render(){
  const ns=(await getAll('novels')).sort((a,b)=>b.addedAt-a.addedAt);
  $('#novels').innerHTML=ns.map(n=>`<li class="novel${n.id===cur?' sel':''}" data-id="${n.id}">
    <div>${n.title}</div>
    <div class="meta">${n.site} · ${n.count} ep · added ${new Date(n.addedAt).toLocaleString()}</div></li>`).join('')
    ||'<li class="meta">nothing yet</li>';
  $('#novels').querySelectorAll('.novel').forEach(li=>li.onclick=()=>select(li.dataset.id));
}
async function select(id){cur=id;await render();await showEps(id);}
async function showEps(id){
  const eps=(await byNovel(id)).sort((a,b)=>a.idx-b.idx);
  const n=(await getAll('novels')).find(x=>x.id===id);
  $('#epHead').textContent='Episodes — '+(n?n.title:'');
  $('#eps').innerHTML=eps.map(e=>`<li><label>
    <input type="checkbox" data-key="${e.key}" checked>
    <span>${pad(e.idx)}. ${e.title}</span></label></li>`).join('')||'<li class="meta">no episodes</li>';
}
const boxes=()=>[...$('#eps').querySelectorAll('input[type=checkbox]')];
$('#all').onclick=()=>boxes().forEach(b=>b.checked=true);
$('#none').onclick=()=>boxes().forEach(b=>b.checked=false);
$('#inv').onclick=()=>boxes().forEach(b=>b.checked=!b.checked);
$('#del').onclick=async()=>{if(!cur||!confirm('Remove from library?'))return;
  const db=await DB();const t=db.transaction(['novels','episodes'],'readwrite');
  t.objectStore('novels').delete(cur);
  (await byNovel(cur)).forEach(e=>t.objectStore('episodes').delete(e.key));
  t.oncomplete=async()=>{cur=null;await render();$('#eps').innerHTML='';};};

$('#dirBtn').onclick=async()=>{
  if(!window.showDirectoryPicker){alert('Use Chrome/Edge for folder saving.');return;}
  rootDir=await showDirectoryPicker({mode:'readwrite'});
  await kvSet('dir',rootDir); log('folder set: '+rootDir.name);};

$('#fetchBtn').onclick=()=>run().catch(e=>log('✖ '+e.message));

$('#gdr').onclick=async()=>{
  const keys=boxes().filter(b=>b.checked).map(b=>b.dataset.key);
  if(!keys.length){alert('No episode checked.');return;}
  const eps=(await byNovel(cur)).filter(e=>keys.includes(e.key)).sort((a,b)=>a.idx-b.idx);
  const w=window.open('','_blank');
  w.document.write('<!DOCTYPE html><meta charset="utf-8"><title>GDR</title>'+
    '<style>body{font:16px/1.9 "Noto Serif JP",serif;max-width:46em;margin:40px auto;padding:0 20px;'+
    'white-space:pre-wrap;word-break:break-word}h2{font-size:1em;border-bottom:1px solid #ccc;'+
    'padding-bottom:4px;margin:2.5em 0 1em}</style>');
  eps.forEach(e=>{const d=w.document;
    const h=d.createElement('h2');h.textContent=e.title;d.body.appendChild(h);
    const p=d.createElement('div');p.textContent=e.text;d.body.appendChild(p);});
  w.document.close();};

render();
</script>
</body>
</html>
